[project]
name = "pkglite"
version = "0.1.10"
description = "Pack and unpack source projects of any programming language into portable text files"
authors = [{ name = "Nan Xiao", email = "nan.xiao1@msd.com" }]
dependencies = ["pathspec>=1.0.0", "rich>=13.9.4", "typer>=0.12.5"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES_THIRD_PARTY"]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",

    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Packaging",

    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Typing :: Typed",
]

requires-python = ">= 3.10"

[project.urls]
Homepage = "https://pharmaverse.github.io/py-pkglite/"
Documentation = "https://pharmaverse.github.io/py-pkglite/"
Repository = "https://github.com/pharmaverse/py-pkglite"
Issues = "https://github.com/pharmaverse/py-pkglite/issues"
Changelog = "https://github.com/pharmaverse/py-pkglite/blob/main/CHANGELOG.md"

[project.scripts]
pkglite = "pkglite.main:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["/docs", "/uv.lock", "/zensical.toml"]
wheel-exclude = ["/docs", "/uv.lock", "/zensical.toml"]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "mkdocstrings-python>=2.0.0",
    "mypy>=1.19.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.7",
    "zensical>=0.0.15",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-v --cov=pkglite --cov-report html"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
